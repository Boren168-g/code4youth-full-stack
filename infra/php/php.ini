; Code4Youth — local development PHP settings
; Loaded as /usr/local/etc/php/conf.d/99-app.ini (last wins)

; Composer regularly exceeds the 128M default when resolving Laravel's tree.
memory_limit = 512M

upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
max_input_vars = 3000

date.timezone = UTC

; Show errors in dev. Never ship this config to a production host.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; opcache with timestamp validation on, so edited files are picked up
; immediately instead of requiring a container restart.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
