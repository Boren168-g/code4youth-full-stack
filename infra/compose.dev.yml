name: code4youth-dev

services:
  php:
    build:
      context: ./php
      dockerfile: Dockerfile.dev
    image: localhost/c4y-php:dev
    environment:
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS: /var/www/html/storage/app/firebase/service-account.json
    volumes:
      - ../api:/var/www/html:z
    networks: [c4y]

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ../api:/var/www/html:ro,z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on: [php]
    networks: [c4y]

  phpmyadmin:
    image: docker.io/library/phpmyadmin:5
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      # Hide the server box and use the values above
      PMA_ARBITRARY: 0
      MYSQL_SSL: "true"
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"
    networks: [c4y]

networks:
  c4y:
    driver: bridge
