name: code4youth-dev

services:
  mysql:
    image: docker.io/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-3309}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/zz-app.cnf:ro,Z
      - ./mysql/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [c4y]

  php:
    build:
      context: ./php
      dockerfile: Dockerfile.dev
    image: localhost/c4y-php:dev
    environment:
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS: /var/www/html/storage/app/firebase/service-account.json
    volumes:
      - ../api:/var/www/html:z
    depends_on:
      mysql:
        condition: service_healthy
    networks: [c4y]

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ../api:/var/www/html:ro,z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on: [php]
    networks: [c4y]

  phpmyadmin:
    image: docker.io/library/phpmyadmin:5
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      # Aiven requires SSL. This forces the client to use it.
      PMA_PMADB: ""
      MYSQL_SSL: "true"
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"
    networks: [c4y]

volumes:
  mysql_data_dev:

networks:
  c4y:
    driver: bridge
