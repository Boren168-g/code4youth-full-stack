server {
    listen 80;
    server_name _;

    # Laravel's front controller lives in public/, never the app root.
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/c4y-access.log;
    error_log  /var/log/nginx/c4y-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # "php" is the compose service name; 9000 is php-fpm's default port.
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Block dotfiles (.env, .git) while still allowing ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
